
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CASA LIMPA CARVALHO</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f6f8;
    }

    header {
      background-color: #00a86b;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #00a86b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #007a52;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #00a86b;
      color: white;
    }

    td button {
      background-color: #007bff;
      margin-right: 5px;
    }

    td button:last-child {
      background-color: #dc3545;
    }
  </style>
</head>
<body>

  <header>CASA LIMPA CARVALHO</header>

  <div class="container">
    <h2>Cadastro de Produtos</h2>

    <label for="nome">Nome do Produto:</label>
    <input type="text" id="nome">

    <label for="preco">Preço (R$):</label>
    <input type="number" id="preco" step="0.01">

    <input type="hidden" id="indiceEdicao" value="">
    <button onclick="adicionarOuAtualizarProduto()">Salvar</button>

    <h3>Lista de Produtos</h3>
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Preço (R$)</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-produtos"></tbody>
    </table>
  </div>

  <script>
    let produtos = [];

    window.onload = function() {
      const dadosSalvos = localStorage.getItem('produtos');
      if (dadosSalvos) {
        produtos = JSON.parse(dadosSalvos);
        atualizarTabela();
      }
    };

    function adicionarOuAtualizarProduto() {
      const nome = document.getElementById('nome').value.trim();
      const preco = parseFloat(document.getElementById('preco').value);
      const indice = document.getElementById('indiceEdicao').value;

      if (!nome || isNaN(preco)) {
        alert('Preencha todos os campos corretamente!');
        return;
      }

      if (indice === '') {
        produtos.push({ nome, preco });
      } else {
        produtos[indice] = { nome, preco };
        document.getElementById('indiceEdicao').value = '';
      }

      salvarNoLocalStorage();
      atualizarTabela();
      limparCampos();
    }

    function editarProduto(indice) {
      const produto = produtos[indice];
      document.getElementById('nome').value = produto.nome;
      document.getElementById('preco').value = produto.preco;
      document.getElementById('indiceEdicao').value = indice;
    }

    function excluirProduto(indice) {
      if (confirm('Deseja realmente excluir este produto?')) {
        produtos.splice(indice, 1);
        salvarNoLocalStorage();
        atualizarTabela();
      }
    }

    function atualizarTabela() {
      const tabela = document.getElementById('tabela-produtos');
      tabela.innerHTML = '';
      produtos.forEach((produto, indice) => {
        tabela.innerHTML += `
          <tr>
            <td>${produto.nome}</td>
            <td>R$ ${produto.preco.toFixed(2)}</td>
            <td>
              <button onclick="editarProduto(${indice})">Editar</button>
              <button onclick="excluirProduto(${indice})">Excluir</button>
            </td>
          </tr>`;
      });
    }

    function salvarNoLocalStorage() {
      localStorage.setItem('produtos', JSON.stringify(produtos));
    }

    function limparCampos() {
      document.getElementById('nome').value = '';
      document.getElementById('preco').value = '';
      document.getElementById('indiceEdicao').value = '';
    }
  </script>

</body>
</html>
